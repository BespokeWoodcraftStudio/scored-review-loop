<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
  <title id="t">What one loop looks like</title>
  <desc id="d">An example scorecard with made-up numbers. Code 93 then audited 91, pass. Design 84, not sent to the audit because of a major finding, goes to the fixers. Copy 95 then audited 92, pass. QA 92 then audited 86, fail because found a major. Security 94 then audited 93, pass. Loop result: not yet.</desc>
  <rect width="1200" height="760" fill="#F6F7F9"/>

  <text x="40" y="52" font-size="28" font-weight="700" fill="#1D2433">What one loop looks like</text>
  <rect x="40" y="70" width="410" height="34" rx="17" fill="#FFF4DB" stroke="#B54708" stroke-width="1.5"/>
  <text x="245" y="93" font-size="15" font-weight="700" text-anchor="middle" fill="#8A3B08">EXAMPLE with made-up numbers</text>

  <!-- table card -->
  <rect x="40" y="130" width="1120" height="460" rx="20" fill="#FFFFFF" stroke="#C5CBD6" stroke-width="2"/>
  <!-- headers -->
  <text x="80" y="176" font-size="15" font-weight="700" fill="#475467">DESK</text>
  <rect x="330" y="152" width="300" height="38" rx="19" fill="#DCE8FB"/>
  <text x="480" y="177" font-size="15" font-weight="700" text-anchor="middle" fill="#1B4FA8">First pass (work model)</text>
  <rect x="660" y="152" width="300" height="38" rx="19" fill="#ECE5FA"/>
  <text x="810" y="177" font-size="15" font-weight="700" text-anchor="middle" fill="#5B33A6">Audit (audit model)</text>
  <text x="1060" y="176" font-size="15" font-weight="700" text-anchor="middle" fill="#475467">RESULT</text>
  <path d="M60 208 H1140" stroke="#E4E7EC" stroke-width="2"/>

  <!-- Row 1 Code: y center 244 -->
  <text x="80" y="251" font-size="20" font-weight="700" fill="#1D2433">Code</text>
  <rect x="410" y="226" width="80" height="38" rx="12" fill="#DCE8FB" stroke="#2F6FDB" stroke-width="2"/>
  <text x="450" y="253" font-size="22" font-weight="700" text-anchor="middle" fill="#1B4FA8">93</text>
  <rect x="740" y="226" width="80" height="38" rx="12" fill="#ECE5FA" stroke="#7448C9" stroke-width="2"/>
  <text x="780" y="253" font-size="22" font-weight="700" text-anchor="middle" fill="#5B33A6">91</text>
  <rect x="990" y="226" width="140" height="38" rx="19" fill="#DDF3E6" stroke="#1E7A4F" stroke-width="2"/>
  <text x="1060" y="251" font-size="16" font-weight="700" text-anchor="middle" fill="#14603C">Pass</text>
  <path d="M60 282 H1140" stroke="#EEF0F4" stroke-width="2"/>

  <!-- Row 2 Design: 318 -->
  <text x="80" y="325" font-size="20" font-weight="700" fill="#1D2433">Design</text>
  <rect x="410" y="300" width="80" height="38" rx="12" fill="#DCE8FB" stroke="#2F6FDB" stroke-width="2"/>
  <text x="450" y="327" font-size="22" font-weight="700" text-anchor="middle" fill="#1B4FA8">84</text>
  <text x="510" y="325" font-size="15" fill="#475467">a major finding</text>
  <text x="740" y="325" font-size="16" font-weight="700" fill="#667085">not sent</text>
  <rect x="990" y="300" width="140" height="38" rx="19" fill="#FFF0E0" stroke="#B54708" stroke-width="2"/>
  <text x="1060" y="325" font-size="16" font-weight="700" text-anchor="middle" fill="#8A3B08">To fixers</text>
  <path d="M60 356 H1140" stroke="#EEF0F4" stroke-width="2"/>

  <!-- Row 3 Copy: 392 -->
  <text x="80" y="399" font-size="20" font-weight="700" fill="#1D2433">Copy</text>
  <rect x="410" y="374" width="80" height="38" rx="12" fill="#DCE8FB" stroke="#2F6FDB" stroke-width="2"/>
  <text x="450" y="401" font-size="22" font-weight="700" text-anchor="middle" fill="#1B4FA8">95</text>
  <rect x="740" y="374" width="80" height="38" rx="12" fill="#ECE5FA" stroke="#7448C9" stroke-width="2"/>
  <text x="780" y="401" font-size="22" font-weight="700" text-anchor="middle" fill="#5B33A6">92</text>
  <rect x="990" y="374" width="140" height="38" rx="19" fill="#DDF3E6" stroke="#1E7A4F" stroke-width="2"/>
  <text x="1060" y="399" font-size="16" font-weight="700" text-anchor="middle" fill="#14603C">Pass</text>
  <path d="M60 430 H1140" stroke="#EEF0F4" stroke-width="2"/>

  <!-- Row 4 QA: 466 -->
  <text x="80" y="473" font-size="20" font-weight="700" fill="#1D2433">QA</text>
  <rect x="410" y="448" width="80" height="38" rx="12" fill="#DCE8FB" stroke="#2F6FDB" stroke-width="2"/>
  <text x="450" y="475" font-size="22" font-weight="700" text-anchor="middle" fill="#1B4FA8">92</text>
  <rect x="740" y="448" width="80" height="38" rx="12" fill="#ECE5FA" stroke="#7448C9" stroke-width="2"/>
  <text x="780" y="475" font-size="22" font-weight="700" text-anchor="middle" fill="#5B33A6">86</text>
  <text x="840" y="473" font-size="15" fill="#475467">found a major</text>
  <rect x="990" y="448" width="140" height="38" rx="19" fill="#FCE4E1" stroke="#B42318" stroke-width="2"/>
  <text x="1060" y="473" font-size="16" font-weight="700" text-anchor="middle" fill="#912018">Fail</text>
  <path d="M60 504 H1140" stroke="#EEF0F4" stroke-width="2"/>

  <!-- Row 5 Security: 522 -->
  <text x="80" y="549" font-size="20" font-weight="700" fill="#1D2433">Security</text>
  <rect x="410" y="522" width="80" height="38" rx="12" fill="#DCE8FB" stroke="#2F6FDB" stroke-width="2"/>
  <text x="450" y="549" font-size="22" font-weight="700" text-anchor="middle" fill="#1B4FA8">94</text>
  <rect x="740" y="522" width="80" height="38" rx="12" fill="#ECE5FA" stroke="#7448C9" stroke-width="2"/>
  <text x="780" y="549" font-size="22" font-weight="700" text-anchor="middle" fill="#5B33A6">93</text>
  <rect x="990" y="522" width="140" height="38" rx="19" fill="#DDF3E6" stroke="#1E7A4F" stroke-width="2"/>
  <text x="1060" y="547" font-size="16" font-weight="700" text-anchor="middle" fill="#14603C">Pass</text>

  <!-- loop result -->
  <rect x="40" y="620" width="1120" height="76" rx="20" fill="#FFF0E0" stroke="#B54708" stroke-width="2"/>
  <text x="80" y="652" font-size="20" font-weight="700" fill="#8A3B08">Loop result: not yet.</text>
  <text x="80" y="680" font-size="17" fill="#1D2433">Design and QA findings go to the fixers; the next loop reviews again.</text>

  <!-- legend -->
  <text x="40" y="732" font-size="15" fill="#475467">A pass needs every desk audited at 90 or more with nothing blocking or major open. Design was never sent to the audit, so it cannot pass.</text>
</svg>
