<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="t d" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
  <title id="t">Who does what</title>
  <desc id="d">The work model, Sonnet 5.5 by default, proves, reviews first, records, fixes and checks. The audit model, Opus 5.5 by default, does the final audit only for desks already at the bar. Blocking and major findings block a pass, minor findings get fixed but do not block, and a note is a preference.</desc>
  <rect width="1200" height="740" fill="#F6F7F9"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#1D2433">Who does what</text>
  <text x="40" y="80" font-size="16" fill="#475467">The cheaper model does the volume. The strong model is kept for the last word.</text>

  <!-- work panel -->
  <rect x="40" y="110" width="540" height="380" rx="20" fill="#FFFFFF" stroke="#2F6FDB" stroke-width="2"/>
  <path d="M40 130 a20 20 0 0 1 20 -20 H560 a20 20 0 0 1 20 20 V180 H40 Z" fill="#DCE8FB"/>
  <rect x="40" y="110" width="540" height="380" rx="20" fill="none" stroke="#2F6FDB" stroke-width="2"/>
  <text x="70" y="146" font-size="22" font-weight="700" fill="#1B4FA8">Work model</text>
  <text x="70" y="169" font-size="15" fill="#344054">Sonnet 5.5 by default</text>
  <circle cx="74" cy="245" r="6" fill="#2F6FDB"/>
  <text x="96" y="250" font-size="17" fill="#1D2433">Proves the work by running it for real</text>
  <circle cx="74" cy="291" r="6" fill="#2F6FDB"/>
  <text x="96" y="296" font-size="17" fill="#1D2433">Reviews first, with every desk in parallel</text>
  <circle cx="74" cy="337" r="6" fill="#2F6FDB"/>
  <text x="96" y="342" font-size="17" fill="#1D2433">Records one log per loop</text>
  <circle cx="74" cy="383" r="6" fill="#2F6FDB"/>
  <text x="96" y="388" font-size="17" fill="#1D2433">Fixes the findings</text>
  <circle cx="74" cy="429" r="6" fill="#2F6FDB"/>
  <text x="96" y="434" font-size="17" fill="#1D2433">Checks: build, lint, tests</text>

  <!-- audit panel -->
  <rect x="620" y="110" width="540" height="380" rx="20" fill="#FFFFFF" stroke="#7448C9" stroke-width="2"/>
  <path d="M620 130 a20 20 0 0 1 20 -20 H1140 a20 20 0 0 1 20 20 V180 H620 Z" fill="#ECE5FA"/>
  <rect x="620" y="110" width="540" height="380" rx="20" fill="none" stroke="#7448C9" stroke-width="2"/>
  <text x="650" y="146" font-size="22" font-weight="700" fill="#5B33A6">Audit model</text>
  <text x="650" y="169" font-size="15" fill="#344054">Opus 5.5 by default</text>
  <circle cx="654" cy="245" r="6" fill="#7448C9"/>
  <text x="676" y="250" font-size="17" fill="#1D2433">Final audit, only for desks already at the bar</text>
  <circle cx="654" cy="291" r="6" fill="#7448C9"/>
  <text x="676" y="296" font-size="17" fill="#1D2433">Confirms, downgrades, drops or adds findings</text>
  <circle cx="654" cy="337" r="6" fill="#7448C9"/>
  <text x="676" y="342" font-size="17" fill="#1D2433">Scores the desk again</text>

  <text x="654" y="434" font-size="16" fill="#667085">A desk that still needs fixing never reaches this model.</text>

  <!-- principle -->
  <rect x="40" y="518" width="1120" height="56" rx="28" fill="#FFFFFF" stroke="#C5CBD6" stroke-width="2"/>
  <text x="600" y="553" font-size="19" font-weight="700" text-anchor="middle" fill="#1D2433">The strong model is never spent confirming work that has to be fixed anyway.</text>

  <!-- severities -->
  <text x="40" y="614" font-size="15" font-weight="700" fill="#475467">SEVERITIES</text>
  <rect x="40" y="628" width="265" height="80" rx="16" fill="#FCE4E1" stroke="#B42318" stroke-width="2"/>
  <text x="64" y="660" font-size="19" font-weight="700" fill="#912018">Blocking</text>
  <text x="64" y="687" font-size="15" fill="#1D2433">blocks a pass</text>
  <rect x="325" y="628" width="265" height="80" rx="16" fill="#FFF0E0" stroke="#B54708" stroke-width="2"/>
  <text x="349" y="660" font-size="19" font-weight="700" fill="#8A3B08">Major</text>
  <text x="349" y="687" font-size="15" fill="#1D2433">blocks a pass</text>
  <rect x="610" y="628" width="265" height="80" rx="16" fill="#FFF9DB" stroke="#A16207" stroke-width="2"/>
  <text x="634" y="660" font-size="19" font-weight="700" fill="#854D0E">Minor</text>
  <text x="634" y="687" font-size="15" fill="#1D2433">gets fixed, does not block</text>
  <rect x="895" y="628" width="265" height="80" rx="16" fill="#EEF0F4" stroke="#98A2B3" stroke-width="2"/>
  <text x="919" y="660" font-size="19" font-weight="700" fill="#344054">Note</text>
  <text x="919" y="687" font-size="15" fill="#1D2433">a preference</text>
</svg>
